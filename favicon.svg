<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Manuscript Scorer: the § every line in the app carries, as a tile.
       The mark is Concept D of the logo exploration; the tile keeps its own
       background so it reads on light and dark browser chrome alike. -->
